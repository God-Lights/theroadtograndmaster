name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치의 배포가 겹치지 않게 한다 (배포 중인 실행은 취소하지 않는다)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    # PR에서는 검증만 하고, main 푸시 또는 수동 실행에서만 배포한다
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Apply D1 migrations
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply rtgm --remote

      - name: Deploy Worker
        working-directory: apps/worker
        run: npx wrangler deploy
        # GitHub 변수(Variables)를 Worker 일반 변수로 넘기려면 위 명령에 --var 를 붙인다:
        #   npx wrangler deploy --var NAME:${{ vars.NAME }}

      # GitHub 시크릿 → Cloudflare Worker 시크릿. 새 값이 필요하면 아래 env 와 jq 에 한 줄씩 추가한다.
      # 값은 명령행·로그에 나오지 않고 stdin 으로만 전달된다.
      - name: Sync secrets to Cloudflare
        working-directory: apps/worker
        env:
          GL_ACCOUNT_KEY: ${{ secrets.GL_ACCOUNT_KEY }}
        run: |
          test -n "$GL_ACCOUNT_KEY" || { echo "::error::GitHub 시크릿 GL_ACCOUNT_KEY 가 비어 있습니다"; exit 1; }
          jq -n --arg gl "$GL_ACCOUNT_KEY" '{GL_ACCOUNT_KEY: $gl}' | npx wrangler secret bulk
