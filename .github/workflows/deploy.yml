name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치의 배포가 겹치지 않게 한다 (배포 중인 실행은 취소하지 않는다)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    # PR에서는 검증만 하고, main 푸시 또는 수동 실행에서만 배포한다
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Apply D1 migrations
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply rtgm --remote

      - name: Deploy Worker
        working-directory: apps/worker
        env:
          # 관리자: GL Account 사용자 ID(UUID)를 쉼표로 구분해 GitHub 변수(Variables) ADMIN_USER_IDS 에 넣는다
          ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
          # 디스코드 봇 (공개 값이라 변수로 둔다): 앱의 Public Key, 전체 알림을 올릴 채널 ID
          DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
          DISCORD_ANNOUNCE_CHANNEL_ID: ${{ vars.DISCORD_ANNOUNCE_CHANNEL_ID }}
        run: npx wrangler deploy --var "ADMIN_USER_IDS:$ADMIN_USER_IDS" --var "DISCORD_PUBLIC_KEY:$DISCORD_PUBLIC_KEY" --var "DISCORD_ANNOUNCE_CHANNEL_ID:$DISCORD_ANNOUNCE_CHANNEL_ID"
        # 다른 GitHub 변수도 같은 방식으로 --var 를 추가해 Worker 변수로 넘긴다.

      # GitHub 시크릿 → Cloudflare Worker 시크릿. 새 값이 필요하면 아래 env 와 jq 에 한 줄씩 추가한다.
      # 값은 명령행·로그에 나오지 않고 stdin 으로만 전달된다.
      - name: Sync secrets to Cloudflare
        working-directory: apps/worker
        env:
          GL_ACCOUNT_KEY: ${{ secrets.GL_ACCOUNT_KEY }}
          # 디스코드 봇 서비스 키 (선택). 비어 있으면 봇 기능이 꺼진 상태로 유지된다.
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          # 봇 토큰 (선택): 전체 알림을 채널에 올릴 때만 필요
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          test -n "$GL_ACCOUNT_KEY" || { echo "::error::GitHub 시크릿 GL_ACCOUNT_KEY 가 비어 있습니다"; exit 1; }
          jq -n --arg gl "$GL_ACCOUNT_KEY" --arg bot "$BOT_API_KEY" --arg dt "$DISCORD_BOT_TOKEN" '{GL_ACCOUNT_KEY: $gl} + (if $bot != "" then {BOT_API_KEY: $bot} else {} end) + (if $dt != "" then {DISCORD_BOT_TOKEN: $dt} else {} end)' | npx wrangler secret bulk

      # 슬래시 명령어 등록 (DISCORD_APP_ID 변수와 DISCORD_BOT_TOKEN 시크릿이 있을 때만; 없으면 건너뜀)
      - name: Register Discord commands
        env:
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/register-discord-commands.mjs
