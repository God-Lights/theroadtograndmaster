name = "rtgm"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# 빌드된 React 클라이언트를 정적 에셋으로 서빙. 로그인 검사를 위해 모든 요청이 Worker를 먼저 거친다.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "rtgm"
# 배포 전 `wrangler d1 create rtgm` 으로 만든 ID로 교체
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# GL Account 서비스 키는 시크릿으로만 등록한다 (코드·저장소에 넣지 않는다):
#   npx wrangler secret put GL_ACCOUNT_KEY
# 로컬 개발은 apps/worker/.dev.vars (gitignore 대상) — .dev.vars.example 참고.
# 커스텀 도메인: officialgl.com 존이 이 Cloudflare 계정에 있어야 한다.
# gl_session 쿠키(Domain=.officialgl.com)가 오려면 반드시 이 하위 도메인으로 접속해야 한다.
routes = [{ pattern = "rtgm.officialgl.com", custom_domain = true }]

# 이후 단계에서 추가: 레이드/매치/채팅용 Durable Objects, 캐시용 KV
